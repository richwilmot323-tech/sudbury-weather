name: Probe climate APIs (temporary)
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml", "scripts/probe.sh"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/probe.sh
      - run: |
          git config user.name "weather-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-tmp && git rm -rf --quiet . && cp /tmp/probe/* . && git add -A && git commit -qm probe && git push -f origin HEAD:probe
